name: Build and deploy

# The nightly rebuild runs here rather than on Cloudflare Pages: Actions is free
# for public repos, so the 500-builds-per-month Pages limit never applies.
#
# SECURITY — read before adding a trigger.
#
# The `deploy` job holds CLOUDFLARE_API_TOKEN, which can deploy Workers and
# rewrite D1. This repository is public, so anyone can open a pull request
# against it. The triggers below are deliberately limited to events that only a
# collaborator can cause. Do NOT add `pull_request` or, above all,
# `pull_request_target` to this file: fork pull requests would then run
# contributor-authored code in a job holding a deploy credential, which is the
# single most common way public repositories leak production access.
# TWO SCHEDULES, AND THEY DO DIFFERENT AMOUNTS OF WORK.
#
# The static site is what goes stale: "Latest disclosures", the severity chart
# and every /cve/ page are HTML baked at build time, while the odometer polls KV
# and moves within 15 minutes. Left on a nightly build the homepage counts a CVE
# it cannot yet show — which is exactly the report that prompted this.
#
# So the site rebuilds every 3 hours. The full D1 push does NOT, because it costs
# ~19,300 row-writes (it DELETEs every table then reinserts ~9,600 rows) against
# a 100,000/day free-plan budget. Eight of those is ~154,000 — over the limit,
# and it would starve the Worker's own delta writes. D1 does not need it anyway:
# the Worker's 15-minute cron already keeps D1 current, and the nightly push is
# a reconciliation against drift, not the means of getting new CVEs in.
on:
  schedule:
    - cron: '0 7 * * *' # nightly: rebuild + full D1 reconciliation
    - cron: '0 */3 * * *' # every 3h: rebuild the static site only
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs, not moving tags. A tag can be
# repointed at new code by whoever controls the action; a SHA cannot. That
# matters more than usual in a job that holds a deploy token.
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Sparse checkout: only the years we track. `--from` below must match, or
      # the runner spends its disk and time on years nothing reads.
      #
      # Cloned to an absolute path, and passed as one. `npm run -w` executes with
      # cwd inside packages/ingest, so `--clone ../cvelistV5` resolves to
      # packages/cvelistV5 and the backfill finds nothing — which is exactly how
      # this job failed on its first run.
      - name: Fetch CVE List
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/CVEProject/cvelistV5.git "$RUNNER_TEMP/cvelistV5"
          cd "$RUNNER_TEMP/cvelistV5"
          git sparse-checkout set $(for y in $(seq 2024 $(date -u +%Y)); do echo -n "cves/$y "; done)

      - name: Backfill and enrich
        run: |
          npm run backfill -- \
            --clone "$RUNNER_TEMP/cvelistV5" \
            --from 2024 \
            --db "$PWD/cybercves.sqlite"

      # ---------------------------------------------------------------------
      # Discovery attribution — MUST run before the D1 push.
      #
      # `push:d1` truncates every table and reinserts, and the runner starts with
      # no database, so whatever is not in SQLite at this point is destroyed in
      # D1. Fortinet publishes no discovery data in the CVE List — it exists only
      # on their PSIRT advisory pages — so omitting this step would silently
      # reset Fortinet to 100% "not disclosed" every single night, which is a
      # false claim about a named company rather than a missing feature.
      #
      # This reads data/discovery/*.yaml and makes no network requests. Refreshing
      # that file is a deliberate act (`npm run discovery`) reviewed in a pull
      # request — a deploy must be a pure function of what is committed, not of
      # whether fortiguard.com was reachable at 07:00 UTC.
      # ---------------------------------------------------------------------
      - name: Apply committed discovery attribution
        run: npm run discovery:apply -- --db "$PWD/cybercves.sqlite"

      # Schema first, and on EVERY deploy — including the 3-hourly refresh that
      # skips the data push below.
      #
      # The Worker ships on every run, so a deploy can carry code that writes to
      # a table D1 does not have yet. Gating migrations the way the data push is
      # gated would leave that window open for hours: the corrections form would
      # answer 500 while looking perfectly fine in the build logs. Migrations are
      # additive and idempotent, so running them every time costs nothing.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cybercve --remote
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Skipped on the 3-hourly refresh — see the note on the triggers above.
      # A push to main and a manual dispatch both DO push, because either can
      # carry a taxonomy or discovery change that has to reach D1 to take effect.
      - name: Push to D1
        if: github.event.schedule != '0 */3 * * *'
        run: npm run push:d1 -- --db "$PWD/cybercves.sqlite" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build site
        run: npm run build:web
        env:
          CYBERCVE_DB: ${{ github.workspace }}/cybercves.sqlite
          # Both are public values baked into the HTML — the Turnstile SITE key
          # (its secret half is a Worker secret) and the analytics beacon token.
          # Repository variables, not secrets, because neither is one. If a
          # variable is unset the feature is simply omitted: no Turnstile widget,
          # no beacon, and the form fails closed rather than accepting unverified
          # submissions.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The taxonomy review queue is the health signal for coverage: unmapped
      # product strings mean CVEs we hold but cannot categorize.
      - name: Report taxonomy gaps
        if: always()
        run: npm run taxonomy:review -- --db "$PWD/cybercves.sqlite" --limit 25
