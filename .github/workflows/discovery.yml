name: Refresh discovery attribution

# Keeps data/discovery/*.yaml current as new Fortinet advisories appear.
#
# WHY THIS IS A SEPARATE WORKFLOW, AND NOT A STEP IN THE DEPLOY
#
# The deploy must be a pure function of what is committed — that is the whole
# reason discovery attribution lives in a reviewed YAML file rather than being
# scraped at build time. So this job does not feed the deploy directly. It
# scrapes, commits the result, and then asks the deploy to run. The invariant
# holds: production data still comes from a file in git that a human can read,
# diff, and revert.
#
# WHY POLLING RATHER THAN A PUSH FROM THE WORKER
#
# The Worker's 15-minute cron is what first sees a new CVE, so it could fire a
# repository_dispatch and cut latency to minutes. It would also mean storing a
# GitHub token with write access to this repository inside Cloudflare, and a new
# Fortinet CVE usually lands in the CVE List *before* its advisory page is
# published — so the faster trigger would often scrape a page that does not
# answer yet and need retrying anyway. Hourly polling costs no new credential,
# retries for free, and is well inside the window that matters here.
on:
  schedule:
    - cron: '25 * * * *' # hourly, offset off the hour to avoid the busy minute
  workflow_dispatch:
    inputs:
      max:
        description: 'Maximum advisories to fetch this run'
        required: false
        default: '40'

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      # Commit the refreshed YAML back. This is the built-in GITHUB_TOKEN — no
      # secret to create, and its write access is scoped to this repository.
      contents: write
      # Ask the deploy workflow to run. A push made with GITHUB_TOKEN does not
      # trigger other workflows (GitHub's loop guard), so the dispatch below is
      # not optional — without it the refreshed file would sit uncommitted to
      # production until the nightly build.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One HTTP request decides whether this run does anything at all. The
      # alternative — clone the CVE List and rebuild a database to find out —
      # takes minutes, which is what would make an hourly schedule untenable.
      - name: Check for unattributed advisories
        id: check
        run: |
          # Treated as "nothing to do" rather than a failure when the site is
          # unreachable or the endpoint is not deployed yet. This job is a
          # background refresher; it should go quiet during an outage, not page
          # someone every hour about a scrape it was never going to run.
          body=$(curl -fsS --max-time 30 \
                   "https://cybercve.com/api/v1/discovery/pending?vendor=fortinet" 2>/dev/null) || {
            echo "::warning::discovery endpoint unreachable — skipping this run"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          }
          n=$(echo "$body" | jq -r '.count // 0')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n advisory page(s) to read · $(echo "$body" | jq -r '.withoutAdvisory // 0') with no advisory link"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.count != '0'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.check.outputs.count != '0'

      # Paced at 20s per page — ten times what fortiguard.com's robots.txt asks
      # for. Capped per run so a batch release does not produce a job that sits
      # scraping for hours; the remainder is picked up next hour.
      # A failure here is recorded, not raised — see the re-raise step at the end.
      #
      # The reason is that a refused run still produces something that must
      # survive it: the record of which advisories were refused. That record is
      # what paces the retry, and a runner that dies holding it leaves the
      # refusal permanently due, which is exactly what turned one blocked scrape
      # into a job that failed every hour. So the commit step runs either way.
      # It is safe for a genuine crash too: the merge only ever adds, and a run
      # that died before writing leaves nothing to commit.
      - name: Fetch attribution
        id: fetch
        if: steps.check.outputs.count != '0'
        run: |
          set +e
          npm run discovery:fetch -- \
            --from "https://cybercve.com/api/v1/discovery/pending?vendor=fortinet" \
            --vendor fortinet \
            --delay 20000 \
            --max "${{ inputs.max || '40' }}"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and deploy if anything changed
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/discovery/; then
            echo "no change — the advisories carry no attribution yet, will retry"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery/

          # Three different commits, because they are three different claims:
          # what Fortinet credits, what it published without credit, and what we
          # were not allowed to read. This file's value is that a reader can
          # trust it, and its history is part of the file — labelling a refusal
          # as an attribution refresh would put a false statement in it.
          if [ "${{ steps.fetch.outputs.attribution-changed }}" = "true" ]; then
            git commit -m "Refresh Fortinet discovery attribution

          $(git diff --cached --stat -- data/discovery/ | tail -1)

          Generated by the hourly refresh job from fortiguard.com PSIRT
          advisories. Applied to production by the deploy workflow, which reads
          this file rather than scraping."
          elif [ "${{ steps.fetch.outputs.blocked }}" != "0" ]; then
            git commit -m "Record a refused Fortinet scrape

          $(git diff --cached --stat -- data/discovery/ | tail -1)

          No attribution changed. fortiguard.com answered with its bot challenge
          rather than advisories, so the affected CVEs are on the refusal backoff
          and will be retried in 24h. Nothing here claims anything about who
          found these CVEs — keeping that separate is the point of the bucket."
          else
            git commit -m "Back off Fortinet advisories that carry no attribution

          $(git diff --cached --stat -- data/discovery/ | tail -1)

          These advisories were read and name no finder. Recorded so the hourly
          job stops re-fetching them, and retried once the entry ages out."
          fi
          git push

          # Only a real attribution change is worth rebuilding production for. A
          # commit that records a refusal changes nothing the site displays, and
          # deploying for it would put a pointless build in the way of every
          # genuine one.
          if [ "${{ steps.fetch.outputs.attribution-changed }}" = "true" ]; then
            # A GITHUB_TOKEN push does not trigger workflows, so publish explicitly.
            gh workflow run deploy.yml --ref main
            echo "committed and requested a deploy"
          else
            echo "committed the refusal record — no deploy, nothing user-visible changed"
          fi

      # Re-raised now that the backoff is safely committed. The job still goes
      # red on a refused scrape — that signal is the whole point, and burying it
      # is how the original misclassification survived two days unnoticed. It
      # now goes red once a day rather than twenty-four times.
      #
      # Keyed on "did the fetch fail" rather than on the specific exit code, so
      # a crash is never silently swallowed by this step's own bookkeeping.
      - name: Re-raise a failed fetch
        if: steps.fetch.outputs.exit-code != '' && steps.fetch.outputs.exit-code != '0'
        run: |
          if [ "${{ steps.fetch.outputs.exit-code }}" = "2" ]; then
            echo "::error::fortiguard.com refused the scrape — it served its bot challenge instead of advisories. The affected advisories are on a 24h backoff, so this job reports again after the next refused attempt rather than every hour. No CVE has been recorded as uncredited on this evidence."
          else
            echo "::error::discovery:fetch exited ${{ steps.fetch.outputs.exit-code }} — see the Fetch attribution step."
          fi
          exit 1
