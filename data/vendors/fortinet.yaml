slug: fortinet
name: Fortinet
homepage: https://www.fortinet.com
psirtUrl: https://www.fortiguard.com/psirt

# Verified against CVE-2025-32756, whose cveMetadata.assignerShortName is "fortinet".
cnaShortNames:
  - fortinet

aliases:
  - Fortinet
  - Fortinet, Inc.
  - Fortinet Inc

# A Fortinet PSIRT advisory URL in a CVE's references is strong evidence the CVE
# is theirs, even when a third party filed it through another CNA.
psirtHosts:
  - fortiguard.fortinet.com
  - www.fortiguard.com
  - fortiguard.com

# The CVE List already carries Fortinet's structured advisory data. The RSS feed
# at filestore.fortinet.com/fortiguard/rss/ir.xml has no structured CVE, CVSS, or
# product fields, so it is a freshness signal only — used to surface an advisory
# before its CVE record lands, not as a data source.
adapter: rss
rssUrl: https://filestore.fortinet.com/fortiguard/rss/ir.xml
advisoryIdPattern: 'FG-IR-\d{2}-\d+'

# Brands Fortinet's own security organisation publishes under. Used to tell an
# in-house finder from an outside one when reading PSIRT acknowledgements —
# "of FortiGuard Labs" is internal, and the string "Fortinet" never appears.
internalBrandMarkers:
  - FortiGuard

# Shown on the vendor page when we hold no attribution for them. Fortinet does
# publish who found each issue — in the Acknowledgement section of each PSIRT
# advisory — just not in the CVE record like Cisco and Palo Alto do. Without this
# note the vendor page would imply they disclose less than their peers, which is
# not what the data says.
discoveryNote: >-
  Fortinet publishes discovery attribution in each PSIRT advisory — and in the
  CSAF document behind it — rather than in the machine-readable CVE record. We
  read the CSAF feed, which covers recent advisories; older ones are not listed
  there and are still missing here.

# Categories this vendor competes in.
#
# Declared, not derived from the products in products/fortinet.yaml. A category
# with no mapped product is ambiguous — it can mean "they had no CVEs here" or
# "they do not sell this" — and those are opposite claims about a named company.
# A 0 under a category a vendor does not compete in reads as a clean record
# rather than an absence, which is the bug this list exists to fix.
#
# Deriving instead of declaring would have published "Cisco has no vulnerability
# management" purely because nobody has written a rule for Kenna yet. Same
# reason `security` on a category is declared rather than inferred.
#
# validateBundle refuses to start if any product lands in a category missing
# from this list, so the declaration cannot silently rot. Categories absent
# here render as N/A.
portfolio:
  - firewall
  - endpoint
  - sase-sse
  - vpn-remote-access
  - email-security
  - identity
  - siem-logging
  - threat-detection
  - vulnerability-management
  - web-app-security
  # FortiCNAPP (Lacework, acquired 2024) and FortiCWP.
  - cloud-security
  # FortiGate Rugged and the OT Security Service.
  - ot-iot-security
  - network-management
  - routing-switching
  - other
  # Nothing absent. Fortinet is unusually broad, and a vendor with no N/A at
  # all is a real finding rather than a missing declaration.
