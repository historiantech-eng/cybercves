# Cisco product -> category mappings.
#
# Cisco's product strings are long and inconsistent ("Cisco IOS XE Software",
# "Cisco Adaptive Security Appliance (ASA) Software"), so patterns carry more
# weight here than exact aliases. Most Cisco CVEs land in routing-switching or
# other, both excluded from default security comparisons — without that split,
# Cisco's breadth would swamp any comparison against a pure-play security vendor.

vendorSlug: cisco
products:
  - slug: cisco-ios-xe
    name: Cisco IOS XE Software
    categorySlug: routing-switching
    aliases: [Cisco IOS XE Software, Cisco IOS XE, IOS XE]
    patterns: ['^(cisco )?ios xe\b', '\bios xe software\b']

  - slug: cisco-ios
    name: Cisco IOS Software
    categorySlug: routing-switching
    aliases: [Cisco IOS Software, Cisco IOS, IOS]
    patterns: ['^(cisco )?ios software\b', '^(cisco )?ios$']

  - slug: cisco-nx-os
    name: Cisco NX-OS Software
    categorySlug: routing-switching
    aliases: [Cisco NX-OS Software, Cisco NX-OS, NX-OS]
    patterns: ['^(cisco )?nx.?os\b', '\bnx.?os software\b']

  - slug: cisco-ios-xr
    name: Cisco IOS XR Software
    categorySlug: routing-switching
    aliases: [Cisco IOS XR Software, Cisco IOS XR, IOS XR]
    patterns: ['^(cisco )?ios xr\b']

  - slug: cisco-asa
    name: Cisco Adaptive Security Appliance (ASA)
    categorySlug: firewall
    aliases:
      - Cisco Adaptive Security Appliance (ASA) Software
      - Cisco ASA
      - Cisco Adaptive Security Appliance
    patterns: ['\badaptive security appliance\b', '^(cisco )?asa\b']

  - slug: cisco-ftd
    name: Cisco Firepower Threat Defense (FTD)
    categorySlug: firewall
    aliases:
      - Cisco Firepower Threat Defense Software
      - Cisco Firepower Threat Defense
      - Cisco FTD
    patterns: ['\bfirepower threat defense\b']

  - slug: cisco-secure-firewall
    name: Cisco Secure Firewall
    categorySlug: firewall
    aliases: [Cisco Secure Firewall, Cisco Secure Firewall ASA]
    patterns: ['^(cisco )?secure firewall\b']

  - slug: cisco-fmc
    name: Cisco Secure Firewall Management Center
    categorySlug: network-management
    aliases:
      - Cisco Firepower Management Center
      - Cisco Secure Firewall Management Center
      - Cisco FMC
    patterns: ['\bfirepower management center\b', '\bfirewall management center\b']

  - slug: cisco-secure-client
    name: Cisco Secure Client (AnyConnect)
    categorySlug: vpn-remote-access
    aliases:
      - Cisco AnyConnect Secure Mobility Client
      - Cisco Secure Client
      - Cisco AnyConnect
    patterns: ['\banyconnect\b', '^(cisco )?secure client\b']

  - slug: cisco-secure-endpoint
    name: Cisco Secure Endpoint
    categorySlug: endpoint
    aliases:
      - Cisco Secure Endpoint
      - Cisco AMP for Endpoints
      - Cisco Advanced Malware Protection for Endpoints
    patterns: ['^(cisco )?secure endpoint\b', '\bamp for endpoints\b']

  - slug: cisco-secure-email
    name: Cisco Secure Email Gateway
    categorySlug: email-security
    aliases:
      - Cisco Email Security Appliance
      - Cisco Secure Email
      - Cisco Secure Email Gateway
      - Cisco ESA
    patterns: ['\bemail security appliance\b', '^(cisco )?secure email\b']

  - slug: cisco-secure-web
    name: Cisco Secure Web Appliance
    categorySlug: sase-sse
    aliases:
      - Cisco Web Security Appliance
      - Cisco Secure Web Appliance
      - Cisco WSA
    patterns: ['\bweb security appliance\b', '^(cisco )?secure web\b']

  - slug: cisco-umbrella
    name: Cisco Umbrella
    categorySlug: sase-sse
    aliases: [Cisco Umbrella, Cisco Umbrella Roaming Client]
    patterns: ['^(cisco )?umbrella\b']

  - slug: cisco-ise
    name: Cisco Identity Services Engine (ISE)
    categorySlug: identity
    aliases:
