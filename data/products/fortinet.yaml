# Fortinet product -> category mappings.
#
# `aliases` are exact matches against the normalized key (lowercased, trademark
# marks and punctuation stripped, underscores collapsed to spaces).
# `patterns` are case-insensitive regexes tried only when no alias matches.
#
# Anything unmatched lands in the unmapped_product review queue rather than being
# dropped, so gaps here surface as work rather than as silent undercounting.

vendorSlug: fortinet
products:
  - slug: fortinet-fortios
    name: FortiOS
    categorySlug: firewall
    aliases: [FortiOS, Fortinet FortiOS, FortiOS-6K7K]
    patterns: ['^fortios\b']

  - slug: fortinet-fortigate
    name: FortiGate
    categorySlug: firewall
    aliases: [FortiGate, FortiGate Cloud, FortiGate Rugged]
    patterns: ['^fortigate\b']

